name: Tests Python

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unitaires:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Installer les dépendances
        run: python -m pip install -r python/requirements.txt
      - name: Vérifier la syntaxe
        run: python -m compileall -q projet
      - name: Tester les règles métier sans bases ni modèle
        env:
          PYTHONPATH: projet
        run: python -m unittest discover -s projet/tests -v
